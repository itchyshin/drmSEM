url: https://itchyshin.github.io/drmSEM/

# Build into a dedicated dir, not docs/, which holds design + memory docs.
destination: pkgdown-site

template:
  bootstrap: 5
  bslib:
    bootswatch: flatly
    primary: "#3a8068"
    headings-color: "#17362f"
    link-color: "#2d7a62"

# `release`, not `auto`: the GitHub-Actions Pages deploy replaces the whole site
# with each build, so a dev version (e.g. 0.2.0.9000) under `auto` would nest the
# site under /dev/ and leave the root 404. `release` always builds to the site root.
development:
  mode: release

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

reference:
  - title: Building a distributional SEM
    desc: Assemble a piecewise SEM from drmTMB nodes.
    contents:
      - drm_node
      - drm_sem
      - drm_psem
  - title: Graph and paths
    desc: Inspect the component-labelled structural graph.
    contents:
      - paths
      - standardize
      - plot.drm_sem
  - title: Covariance edges and cliques
    desc: >
      Declare and inspect residual (rho12) and higher-level (corpair) covariance
      edges, detect complete covariance cliques (K >= 3), and declare bivariate
      (joint two-response) nodes.
    contents:
      - covary
      - covary_clique
      - covariances
      - covariance_cliques
      - drm_pair
      - drm_expand_pair
      - rho12
      - corpairs
  - title: Latent and MIMIC constructs
    desc: Build latent (MIMIC, reflective, formative) and composite constructs from observed indicators.
    contents:
      - drm_latent
      - drm_indicator
      - drm_composite
      - loadings
      - reliability
      - drm_cronbach_alpha
      - drm_raykov_rho
  - title: Feedback / cyclic motifs
    desc: >
      Declare a feedback motif so specific cycles are allowed (every undeclared
      cycle stays an error). The equilibrium effect engine and consistent
      estimation are staged in docs/design/10-cyclic-feedback.md.
    contents:
      - drm_cycle
      - cycles
  - title: d-separation
    desc: Test missing arrows on any distributional component.
    contents:
      - basis_set
      - dsep
      - fisher_c
  - title: Effects
    desc: Simulation-based direct, indirect, and total effects.
    contents:
      - direct_effects
      - indirect_effects
      - total_effects
      - path_effects
      - plot.drm_effect
  - title: Symbolizer integration
    desc: Render per-node equations from fitted drmSEM objects.
    contents:
      - symbolize.drm_sem
      - symbolized_drm_sem
  - title: Model comparison
    desc: Compare competing causal DAGs by Fisher's C / CBIC.
    contents:
      - drm_dag
      - drm_model_set
      - compare
      - best
      - average
  - title: Interop (graph interchange)
    desc: >
      Translate a drmSEM graph to/from neighbouring ecosystems' text formats
      (lavaan model syntax, Graphviz DOT). Graph interchange only — drmSEM never
      fits its own likelihoods, and non-mean (distributional-component) paths are
      dropped-with-notice when emitting lavaan syntax, never misrepresented as a
      mean regression.
    contents:
      - as_lavaan
      - from_lavaan
      - as_dot
  - title: Phylogenetic SEM
    desc: Build evolutionary covariance matrices for phylogenetic nodes.
    contents:
      - drm_phylo_cov
  - title: Diagnostics
    contents:
      - check_sem
      - imputation
      - imputed

articles:
  - title: Get Started
    desc: Essential workflows for building and inspecting distributional piecewise SEMs.
    contents:
      - drmSEM
      - drmSEM-overview
  - title: Distributional Pathways
    desc: Propagate effects across location, scale, shape, and zero-inflation components.
    contents:
      - effect-decomposition
      - equations-via-symbolizer
      - phylogenetic-sem
  - title: Latents & Measurement
    desc: Incorporate formative, reflective, and MIMIC measurement constructs with reliability metrics.
    contents:
      - latent-variables
      - covariance-edges-and-composites
  - title: Feedback & Covariance
    desc: Model reciprocal causation with Banach fixed-point equilibria and joint bivariate correlation.
    contents:
      - bivariate-nodes
      - feedback-cycles
  - title: Missing Data & Diagnostics
    desc: Graph-derived piecewise imputation, model comparison, d-separation calibration, and recovery validation.
    contents:
      - missing-data
      - model-selection
      - comparison
      - calibration
      - validation
