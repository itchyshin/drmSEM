# Codecov upload policy for drmSEM.
# Presence of this file does not prove coverage ran, uploaded, or was accepted.
# See docs/memory/TEST_COVERAGE.md.
#
# One CI coverage job uploads one report (`ubuntu-covr`). Do not add a second
# OS or shard without raising `after_n_builds` and splitting flags, or Codecov
# will wait for missing uploads or double-count the same tests.
codecov:
  require_ci_to_pass: false
  notify:
    after_n_builds: 1
    wait_for_ci: false

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "tests/**/*"
  - "vignettes/**/*"
  - "docs/**/*"
  - "tools/**/*"
  - "man/**/*"
  - "inst/**/*"
  - "LOOP/**/*"
  - "paper.md"
  - "paper.bib"
