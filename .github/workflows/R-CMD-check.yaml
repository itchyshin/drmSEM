# R CMD check for drmSEM.
# Standard r-lib/actions workflow. NOTE: drmTMB (the fitting engine) is a
# GitHub remote that compiles TMB/C++ from source, so the
# setup-r-dependencies step can be slow on a cold cache.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-2025-vs2026, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Asks R CMD check to run its vignette code-tangling step, which it skips by
      # default whenever check re-builds vignettes. Kept because it is the documented
      # lever and costs nothing -- but it was MEASURED not to work here: with this set
      # and visibly propagated, "checking running R code from vignettes" still did not
      # appear in the check output on any of the three platforms. The real guard is
      # the explicit step below; this line alone would be a guard that cannot be shown
      # to fire.
      _R_CHECK_VIGNETTES_SKIP_RUN_MAYBE_: false

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # drmTMB is pulled from the DESCRIPTION Remotes (itchyshin/drmTMB) and
      # compiles from source, so this step may take a while on a cold cache.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::roxygen2
            github::itchyshin/drmTMB
          needs: check

      # man/*.Rd and NAMESPACE ARE committed/tracked in the repo; this step
      # re-runs roxygenise() to regenerate them so R CMD check sees them in
      # sync with the roxygen comments for every export.
      - name: Document (roxygen2)
        run: Rscript -e 'roxygen2::roxygenise()'
        shell: bash

      # Guards the defect class R CMD check cannot see here. knitr's tangler never
      # EXECUTES chunks, so `opts_chunk$set(eval = has_engine)` in a setup chunk has
      # not run when purl decides what to emit -- any chunk whose OWN header lacks
      # `eval` inherits TRUE and is emitted, then executed by check's tangle-run step.
      # Six vignettes were doing exactly that while CI stayed green, because that step
      # is skipped whenever check re-builds vignettes. `_R_CHECK_VIGNETTES_SKIP_RUN_MAYBE_`
      # was measured NOT to re-enable it, so the property is asserted directly.
      # Verified to FAIL, not merely to pass: reverting one header makes it exit 1.
      - name: Vignettes must tangle to engine-free code
        run: Rscript tools/check-vignette-tangling.R 2>/dev/null
        shell: bash

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
