# Test coverage collection + one Codecov upload.
# Derived from https://github.com/r-lib/actions/tree/v2/examples
# (test-coverage.yaml) and the itchyshin/hsquared First+Next OIDC pattern,
# with these drmSEM-specific choices:
#   * OIDC auth (`use_oidc: true`); no CODECOV_TOKEN and no GH_TOKEN-as-token.
#   * Job-scoped permissions: contents:read + id-token:write only.
#   * Ubuntu-only. Do not add covr to the R-CMD-check OS matrix:
#     ubuntu+macos+windows would triple-count the same testthat suite.
#   * Same skip contracts as ubuntu R-CMD-check. drmTMB is installed from
#     Remotes so engine-gated tests run; they still skip if the engine is
#     absent. Do not add a new scientific suite or weaken skips.
# Config (this file + codecov.yml) does not prove coverage ran, uploaded,
# or was accepted. See docs/memory/TEST_COVERAGE.md.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: test-coverage

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions: {}

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    # drmTMB compiles from source; covr then reinstalls and traces the
    # existing testthat suite. 60 min is the cold-cache budget, not a
    # change to tests or shards.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      # github.sha on pull_request is the synthetic merge commit; the
      # branch head is github.event.pull_request.head.sha. Log both.
      - name: Log branch head vs checkout SHA
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "GITHUB_SHA=${{ github.sha }}"
          echo "REF=${{ github.ref }}"
          echo "HEAD_REF=${{ github.head_ref }}"
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          echo "PR_BASE_SHA=${{ github.event.pull_request.base.sha }}"
          echo "CHECKED_OUT=$(git rev-parse HEAD)"
          git log -1 --oneline
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # needs: check so Suggests (testthat, ggplot2, ape, symbolizer, drmTMB)
      # match ubuntu R-CMD-check. github::itchyshin/drmTMB matches the check
      # workflow: the engine is a GitHub remote that compiles from source.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
            github::itchyshin/drmTMB
          needs: check, coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(
              normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"),
              "package"
            )
          )
          print(cov)
          pct <- round(covr::percent_coverage(cov), 2)
          summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary_file)) {
            writeLines(
              c(
                "## covr (CI coverage finish, not Codecov acceptance)",
                "",
                paste0("- package coverage: ", pct, "%"),
                "- suite: existing testthat under covr tracing (drmTMB installed; skip contracts unchanged)",
                "- this print is CI coverage finish, not upload or dashboard evidence"
              ),
              summary_file
            )
          }
          cat(sprintf("DRMSEM_COVR_PERCENT=%s\n", pct))
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Upload coverage to Codecov (OIDC)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          fail_ci_if_error: true
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          use_oidc: true
          name: drmsem-ubuntu-covr
          flags: ubuntu-covr
          verbose: true

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload coverage-test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
